<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>発表会 KS54 – Kaizen Yoshida School</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #2a1f15;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      gap: 2rem;
    }

    .card {
      width: 100%;
      max-width: 520px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, .55),
        0 4px 16px rgba(0, 0, 0, .35),
        0 0 0 1px rgba(201, 168, 76, .2);
      opacity: 0;
      transform: translateY(30px);
      transition: opacity .7s ease, transform .7s ease;
    }

    .card.visible {
      opacity: 1;
      transform: none;
    }

    .card:nth-child(2) {
      transition-delay: .2s;
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
    }

    footer {
      color: #f5e6c8;
      font-family: Georgia, serif;
      font-size: .75rem;
      letter-spacing: .12em;
      text-align: center;
      padding-bottom: 1rem;
      text-shadow: 0 0 12px rgba(245, 230, 200, .35), 0 1px 3px rgba(0, 0, 0, .5);
      position: relative;
      z-index: 2;
    }

    /* footer petal zone */
    .footer-petals {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    /* floating petals */
    .petals-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      opacity: 0;
      animation: fall linear infinite;
      will-change: transform;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 0;
      }

      8% {
        opacity: 0.55;
      }

      88% {
        opacity: 0.3;
      }

      100% {
        transform: translateY(110vh) rotate(420deg);
        opacity: 0;
      }
    }

    /* footer zone petals drift up slightly then fade */
    .fp {
      position: absolute;
      opacity: 0;
      animation: riseFloat linear infinite;
      will-change: transform;
    }

    @keyframes riseFloat {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0;
      }

      15% {
        opacity: 0.7;
      }

      85% {
        opacity: 0.4;
      }

      100% {
        transform: translateY(-120px) rotate(240deg) scale(0.6);
        opacity: 0;
      }
    }

    .cards-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
    }
  </style>
</head>

  <script>
    const colors = ['#e8c9b5', '#d4b896', '#c9a884', '#f0dece', '#e0c8a8'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      const s = 5 + Math.random() * 9;
      p.style.cssText = 'left:' + Math.random() * 100 + '%;width:' + s + 'px;height:' + (s * 1.4) + 'px;background:' + colors[Math.floor(Math.random() * colors.length)] + ';animation-duration:' + (8 + Math.random() * 10) + 's;animation-delay:' + (Math.random() * 10) + 's;border-radius:' + (Math.random() > .5 ? '50% 0 50% 0' : '0 50% 0 50%') + ';';

    }
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('.card').forEach(el => obs.observe(el));
